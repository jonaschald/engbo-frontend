
<div class="traener-opret-kamp-page">

  <aside class="sidebar">

    <div class="brand">
      <img src="/if-engbo-logo-new.png" alt="IF Engbo">
    </div>

    <nav class="side-menu">

      <a routerLink="/traener" class="menu-item">
        <span class="menu-icon">⌂</span>
        <span>Hjem</span>
      </a>

      <a routerLink="/traener-hold" class="menu-item">
        <span class="menu-icon">♟</span>
        <span>Mine hold</span>
      </a>

      <a routerLink="/traener-traeninger" class="menu-item">
        <span class="menu-icon">▣</span>
        <span>Træninger</span>
      </a>

      <a routerLink="/traener-kampe" class="menu-item active">
        <span class="menu-icon">⚽</span>
        <span>Kampe</span>
      </a>

      <a routerLink="/traener-fremmoede" class="menu-item">
        <span class="menu-icon">✓</span>
        <span>Fremmøde</span>
      </a>

      <div class="menu-item">
        <span class="menu-icon">▦</span>
        <span>Kalender</span>
      </div>

    </nav>

  </aside>

  <main class="main-content">

    <h1>Opret / Rediger Kamp</h1>

    <section class="match-form-section">

      <h2>Kampoplysninger</h2>

      <form (ngSubmit)="saveMatch()">

        <div class="form-group">
          <label for="team">Hold</label>
          <select
            id="team"
            name="team"
            [(ngModel)]="match.team"
            required>
            @for (team of teams; track team) {
              <option [value]="team">{{ team }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="opponent">Modstander</label>
          <input
            id="opponent"
            name="opponent"
            type="text"
            [(ngModel)]="match.opponent"
            placeholder="Indtast modstander"
            required>
        </div>

        <div class="form-group">
          <label for="date">Dato</label>
          <input
            id="date"
            name="date"
            type="date"
            [(ngModel)]="match.date"
            required>
        </div>

        <div class="form-group">
          <label for="time">Tid</label>
          <input
            id="time"
            name="time"
            type="time"
            [(ngModel)]="match.time"
            required>
        </div>

        <div class="form-group">
          <label for="location">Sted</label>
          <input
            id="location"
            name="location"
            type="text"
            [(ngModel)]="match.location"
            placeholder="Indtast sted"
            required>
        </div>

        <div class="form-actions">

          <a routerLink="/traener-kampe" class="cancel-button">
            Annuller
          </a>

          <button type="submit" class="save-button">
            Gem kamp
          </button>

        </div>

      </form>

    </section>

  </main>

</div>
