<div class="login-page">
  <div class="login-container">

    <div class="logo">
      <img src="/if-engbo-logo.png" alt="IF Engbo Logo">
    </div>

    <div class="login-box">
      <h1>Login</h1>

      <form (ngSubmit)="login()">

        <div class="form-group">
          <label for="email">Username or e-mail</label>
          <input
            type="text"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Username or e-mail"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Password"
            required
          >
        </div>

        <button type="submit">Login</button>

        <div class="role-buttons">

          <button
            type="button"
            routerLink="/player"
            (click)="selectRole('Spiller')">
            Spiller
          </button>

          <button
            type="button"
            routerLink="/traener"
            (click)="selectRole('Træner')">
            Træner
          </button>

          <button
            type="button"
            routerLink="/admin"
            (click)="selectRole('Administration')">
            Administration
          </button>

        </div>

      </form>
    </div>

  </div>
</div>
